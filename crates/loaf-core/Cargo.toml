[package]
name = "loaf-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
eyeball = "0.8.8"
matrix-sdk = { version = "=0.19.1", default-features = false, features = [
  "e2e-encryption",
  "sqlite",
  "bundled-sqlite",
  "rustls-aws-lc-rs",
] }
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.54.1", features = ["sync", "time", "rt", "macros", "fs"] }
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
matrix-sdk = { version = "=0.19.1", default-features = false, features = ["testing"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt", "test-util"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
wiremock = "0.6.5"
