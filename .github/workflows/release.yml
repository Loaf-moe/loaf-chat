# Pushing a tag like v0.1.0, on main, is the whole release. Each step is a
# `release:*` mise task; `mise tasks` describes them.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency: release

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      build: ${{ steps.version.outputs.build }}
    # Only scripts run here: mise without its toolchains.
    env:
      MISE_TASK_RUN_AUTO_INSTALL: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
        with:
          install: false
      - id: version
        run: mise run release:version "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      # Builds, signs through Apple's cloud with the same key as iOS, and
      # notarizes: no provisioning profile secret.
      - run: >
          mise run release:macos
          "${{ needs.version.outputs.name }}" "${{ needs.version.outputs.build }}"
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/

  # Straight to TestFlight; nothing iOS goes in the GitHub Release. publish
  # does not need this job, so a slow App Store Connect never holds back the
  # desktop release.
  ios:
    needs: version
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: >
          mise run release:ios
          "${{ needs.version.outputs.name }}" "${{ needs.version.outputs.build }}"
        env:
          # One App Store Connect API key notarizes macOS and, through cloud
          # signing, signs and uploads iOS. The names predate iOS.
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}

  linux:
    needs: version
    # The oldest runner, for the oldest glibc: the AppImage runs on whatever
    # the tester has.
    runs-on: ubuntu-22.04
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run setup:linux:build
      - run: >
          mise run release:linux
          "${{ needs.version.outputs.name }}" "${{ needs.version.outputs.build }}"
        env:
          APPIMAGE_PRIVATE_KEY: ${{ secrets.APPIMAGE_PRIVATE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/

  windows:
    needs: version
    runs-on: windows-latest
    environment: release
    # mise's Flutter does not install on Windows: mise brings Rust, and
    # flutter-action the Flutter that mise.toml pins. Tasks then run with
    # what is there rather than trying for Flutter again.
    env:
      MISE_TASK_RUN_AUTO_INSTALL: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: rust
      - id: flutter
        run: echo "version=$(mise current flutter)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          # Restored from what ci.yml saves on main.
          cache: true
      # The AppImage's key signs Windows' feed entry too; each signs its own
      # text (lib/update/release_feed.dart), so neither passes for the other.
      - run: >
          mise run release:windows
          "${{ needs.version.outputs.name }}" "${{ needs.version.outputs.build }}"
        env:
          APPIMAGE_PRIVATE_KEY: ${{ secrets.APPIMAGE_PRIVATE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

  flatpak:
    needs: [version, linux]
    runs-on: ubuntu-latest
    environment: release
    container:
      # GNOME, matching the manifest's runtime.
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    env:
      MISE_TASK_RUN_AUTO_INSTALL: false
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: false
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist
      - run: mise run release:flatpak "${{ needs.version.outputs.name }}" dist/bundle.tar
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: repo.tar

  publish:
    needs: [version, macos, linux, windows, flatpak]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      MISE_TASK_RUN_AUTO_INSTALL: false
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: mise run release:publish "$GITHUB_REF_NAME" artifacts
