# Nobody here has a Windows machine: this is where Windows gets built and
# tested. Runs on the windows branch and on demand.
name: windows-check

on:
  push:
    branches: [windows, 'windows/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # mise pins both; its Flutter backend does not install on Windows, so
      # the versions are read from mise.toml and installed directly.
      - id: pins
        run: |
          echo "flutter=$(sed -n 's/^flutter = "\(.*\)"/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
          echo "rust=$(sed -n 's/^rust = "\(.*\)"/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pins.outputs.flutter }}
          channel: stable
          cache: true
      - run: |
          rustup toolchain install ${{ steps.pins.outputs.rust }} --profile minimal
          rustup default ${{ steps.pins.outputs.rust }}
      - run: flutter pub get
      - run: flutter test
      - if: ${{ !cancelled() }}
        run: cd packages/loaf_media && flutter test
      # The build and the package run even when a test fails: both answers
      # are worth having from one slow run.
      - if: ${{ !cancelled() }}
        run: flutter build windows --release --dart-define=LOAF_BUILD=0
      # Packs as a release would, with a key made for this run only.
      - if: ${{ !cancelled() }}
        run: |
          export APPIMAGE_PRIVATE_KEY="$(openssl genpkey -algorithm ed25519)"
          tool/release/windows.sh 0.0.0 1 dist
      - if: ${{ !cancelled() }}
        run: tool/release/windows-smoke.sh dist/Loaf-Chat-0.0.0-Setup.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-check
          path: dist/
