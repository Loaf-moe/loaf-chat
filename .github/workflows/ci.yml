# Every pull request and every push to main: the tests, one runner per
# platform. The release builds are release.yml's. Each step is a mise task;
# `mise tasks` lists them, and any runs the same on your machine.
#
# Toolchains are set up the way release.yml sets them up, so what main
# caches here a tag's release finds already there.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request makes the older run moot; every commit
  # on main gets its own answer.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    # The release's runner, for the release's GStreamer.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run setup:linux
      # mise-action keeps Flutter, not the packages it fetches.
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - run: mise run deps
      # The encryption tests' native library. It changes only with
      # vodozemac (in pubspec.lock) or Rust (in mise.toml).
      - id: vodozemac
        uses: actions/cache@v4
        with:
          path: build/vodozemac/*.so
          key: vodozemac-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'mise.toml') }}
      - if: steps.vodozemac.outputs.cache-hit != 'true'
        run: mise run vodozemac
      - if: ${{ !cancelled() }}
        run: mise run test:ci
      - if: ${{ !cancelled() }}
        run: mise run test:media
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/loaf_media/linux/rust
            packages/loaf_media/rust/loaf_streams
      - if: ${{ !cancelled() }}
        run: mise run test:player:linux
      - if: ${{ !cancelled() }}
        run: mise run test:streams
      - if: ${{ !cancelled() }}
        run: mise run test:notify
      - if: ${{ !cancelled() }}
        run: mise run check
