# Every pull request and every push to main: the tests, one runner per
# platform. The release builds are release.yml's.
#
# Toolchains are set up the way release.yml sets them up, so what main
# caches here a tag's release finds already there.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request makes the older run moot; every commit
  # on main gets its own answer.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    # The release's runner, for the release's GStreamer.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: pins
        run: |
          echo "rust=$(sed -n 's/^rust = "\(.*\)"/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
          echo "vodozemac=$(sed -n '/^  flutter_vodozemac:/,/version:/s/^    version: "\(.*\)"/\1/p' pubspec.lock)" >> "$GITHUB_OUTPUT"
      # For the player's Rust. The image's LLVM brings libunwind-14-dev, which
      # conflicts with the libunwind-dev GStreamer needs; as in release.yml,
      # it goes first.
      - run: |
          sudo apt-get update
          sudo apt-get remove -y libunwind-14-dev
          sudo apt-get install -y libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good \
            gstreamer1.0-libav
      - uses: jdx/mise-action@v2
      # mise-action keeps Flutter, not the packages it fetches.
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - run: mise exec -- flutter pub get
      # The encryption tests' native library. It changes only with
      # vodozemac or Rust, so it is built once per pair.
      - id: vodozemac
        uses: actions/cache@v4
        with:
          path: build/vodozemac/*.so
          key: vodozemac-${{ runner.os }}-${{ steps.pins.outputs.vodozemac }}-rust${{ steps.pins.outputs.rust }}
      - if: steps.vodozemac.outputs.cache-hit != 'true'
        run: mise exec -- sh tool/build-vodozemac
      - if: ${{ !cancelled() }}
        run: mise exec -- flutter test -j "$(nproc)"
      - if: ${{ !cancelled() }}
        working-directory: packages/loaf_media
        run: mise exec -- flutter test
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/loaf_media/linux/rust
            packages/loaf_media/rust/loaf_streams
      - if: ${{ !cancelled() }}
        run: mise exec -- cargo test --locked --manifest-path packages/loaf_media/linux/rust/Cargo.toml
      - if: ${{ !cancelled() }}
        run: mise exec -- cargo test --locked --manifest-path packages/loaf_media/rust/loaf_streams/Cargo.toml
      - if: ${{ !cancelled() }}
        run: mise exec -- flutter analyze

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      # Defender scans every file written, and this job writes tens of
      # thousands (Flutter unpacking, compiles); the runner is thrown away
      # after, so there is nothing for it to protect.
      #
      # Windows Server ships Media Foundation as a feature, off by default
      # (every desktop Windows has it), and the player's tests need it. It
      # takes minutes to turn on, so it does while everything else runs.
      - shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          Start-Process powershell -WindowStyle Hidden -ArgumentList `
            '-NoProfile', '-Command', 'Install-WindowsFeature Server-Media-Foundation'
      - uses: actions/checkout@v4
      # mise pins both; its Flutter backend does not install on Windows, so
      # the versions are read from mise.toml and installed directly.
      - id: pins
        run: |
          echo "flutter=$(sed -n 's/^flutter = "\(.*\)"/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
          echo "rust=$(sed -n 's/^rust = "\(.*\)"/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
          echo "vodozemac=$(sed -n '/^  flutter_vodozemac:/,/version:/s/^    version: "\(.*\)"/\1/p' pubspec.lock)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pins.outputs.flutter }}
          channel: stable
          cache: true
      - run: |
          rustup toolchain install ${{ steps.pins.outputs.rust }} --profile minimal
          rustup default ${{ steps.pins.outputs.rust }}
      - run: flutter pub get
      - id: vodozemac
        uses: actions/cache@v4
        with:
          path: build/vodozemac/*.dll
          key: vodozemac-${{ runner.os }}-${{ steps.pins.outputs.vodozemac }}-rust${{ steps.pins.outputs.rust }}
      - if: steps.vodozemac.outputs.cache-hit != 'true'
        run: sh tool/build-vodozemac
      - if: ${{ !cancelled() }}
        run: flutter test -j "$(nproc)"
      - if: ${{ !cancelled() }}
        working-directory: packages/loaf_media
        run: flutter test
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/loaf_media/windows/rust
            packages/loaf_media/rust/loaf_streams
      - if: ${{ !cancelled() }}
        run: cargo test --locked --manifest-path packages/loaf_media/rust/loaf_streams/Cargo.toml
      - if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          while (-not (Get-WindowsFeature Server-Media-Foundation).Installed) {
            Start-Sleep -Seconds 5
          }
          cargo test --locked --manifest-path packages/loaf_media/windows/rust/Cargo.toml
