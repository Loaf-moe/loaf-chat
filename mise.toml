[tools]
flutter = "3.47.5"
rust = "1.96.1"

[env]
# Flutter copies Swift packages with rsync and counts on Apple's, which makes
# the directories above the target. Homebrew's does not, and every Apple
# build stops at "Failed to copy plugin". tool/bin puts Apple's first.
_.path = ["tool/bin"]

[tasks.deps]
description = "Fetch the Dart packages"
run = "flutter pub get"

[tasks.clean]
description = "Remove Flutter's build output and the vodozemac library"
run = "flutter clean"

# ── Setup ────────────────────────────────────────────────────────────────

# The image's LLVM brings libunwind-14-dev, which conflicts with the
# libunwind-dev GStreamer needs; nothing here uses LLVM's libunwind (Flutter
# links libstdc++), so it goes first.
[tasks."setup:linux"]
description = "Install what the tests need on Debian or Ubuntu (GStreamer)"
run = [
  "sudo apt-get update",
  "sudo apt-get remove -y libunwind-14-dev || true",
  """sudo apt-get install -y libgstreamer1.0-dev \
    libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good \
    gstreamer1.0-libav""",
]

# libwebkit2gtk and libsoup: desktop_webview_window (via flutter_web_auth_2)
# requires them at CMake time. The GStreamer dev packages are loaf_media's:
# its Linux plugin finds them through pkg-config.
[tasks."setup:linux:build"]
description = "Install what building the Linux app needs on Debian or Ubuntu"
run = [
  "sudo apt-get update",
  "sudo apt-get remove -y libunwind-14-dev || true",
  """sudo apt-get install -y clang cmake ninja-build pkg-config \
    libgtk-3-dev liblzma-dev libstdc++-12-dev jq \
    libwebkit2gtk-4.1-dev libsoup-3.0-dev \
    libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev""",
]

[tasks.check]
description = "Analyze, and fail on unformatted Dart"
run = [
  "flutter analyze",
  # Named directories: build/ holds copies of plugins, formatted their own way.
  "dart format --output=none --set-exit-if-changed lib test tool packages",
]

[tasks.format]
description = "Format the Dart"
run = "dart format lib test tool packages"

[tasks.vodozemac]
description = "Build the encryption tests' native library (Linux, Windows)"
run = "sh tool/build-vodozemac"

[tasks.test]
description = "The app's tests; arguments go to flutter test"
run = "flutter test"

[tasks."test:media"]
description = "loaf_media's Dart tests"
dir = "packages/loaf_media"
run = "flutter test"

[tasks."test:media:apple"]
description = "loaf_media's Swift tests; needs a Mac"
run = "swift test --package-path packages/loaf_media/darwin/LoafMediaCore"

[tasks."test:streams"]
description = "loaf_streams' Rust tests"
run = "cargo test --locked --manifest-path packages/loaf_media/rust/loaf_streams/Cargo.toml"

[tasks."test:notify"]
description = "loaf_notify's Rust tests"
run = "cargo test --locked --manifest-path packages/loaf_notify/rust/Cargo.toml"

[tasks."test:chrome"]
description = "loaf_chrome's Rust tests"
run = "cargo test --locked --manifest-path packages/loaf_chrome/rust/Cargo.toml"

[tasks."test:player:linux"]
description = "The Linux player's Rust tests; needs GStreamer"
run = "cargo test --locked --manifest-path packages/loaf_media/linux/rust/Cargo.toml"

[tasks."test:player:windows"]
description = "The Windows player's Rust tests; needs Media Foundation"
run = "cargo test --locked --manifest-path packages/loaf_media/windows/rust/Cargo.toml"

[tasks."test:chime"]
description = "The chime generator's Rust tests"
run = "cargo test --locked --manifest-path tool/chime/Cargo.toml"

[tasks."test:all"]
description = "Every test that runs on any platform"
run = [
  { task = "test" },
  { task = "test:media" },
  { task = "test:streams" },
  { task = "test:notify" },
  { task = "test:chrome" },
  { task = "test:chime" },
]

# flutter test runs on half the cores by default; a CI runner has nothing
# else to do with the other half.
[tasks."test:ci"]
description = "The app's tests on every core, as CI runs them (Linux)"
run = 'flutter test -j "$(nproc)"'

[tasks."build:macos"]
description = "Debug build for macOS; also the encryption tests' library there"
run = "flutter build macos --debug"

[tasks."build:linux"]
description = "Debug build for Linux"
run = "flutter build linux --debug"

[tasks."build:ios:sim"]
description = "Debug build for the iOS simulator"
run = "flutter build ios --debug --simulator"

[tasks."build:windows"]
description = "Debug build for Windows"
run = "flutter build windows --debug"

[tasks."run:macos"]
description = "Run on this Mac; arguments go to flutter run"
run = "flutter run -d macos"

[tasks."run:ios"]
description = "Run on an iPhone or iPad"
usage = 'arg "<device>" help="Its name or id, as flutter devices lists it"'
run = 'flutter run -d "{{usage.device}}"'

[tasks."run:ios:sim"]
description = "Run in an iOS simulator"
usage = 'flag "--simulator <name>" default="iPhone 17" help="The simulator, by name"'
run = [
  # Boots it if it is not, and waits: an install into a simulator still
  # starting up kills its service.
  'xcrun simctl bootstatus "{{usage.simulator}}" -b',
  # Xcode 27 shows simulators in Device Hub; there is no Simulator.app.
  "open -a DeviceHub",
  'flutter run -d "{{usage.simulator}}"',
]

[tasks."run:linux"]
description = "Run on this Linux machine; arguments go to flutter run"
run = "flutter run -d linux"

[tasks."run:windows"]
description = "Run on this Windows machine; arguments go to flutter run"
run = "flutter run -d windows"

# ── Generated files ─────────────────────────────────────────────────────
# Their outputs are checked in; run these only to change them.

[tasks."gen:emoji"]
description = "Regenerate the emoji table from tool/emoji-test.txt"
run = "dart run tool/gen_emoji.dart"

[tasks."gen:chime"]
description = "Regenerate the chime sound for every platform"
run = "cargo run --locked --manifest-path tool/chime/Cargo.toml"

[tasks."gen:icons"]
description = "Render the app icons for every platform; needs Inkscape"
run = "tool/icons/render.sh"

# ── Releasing ───────────────────────────────────────────────────────────
# Pushing a tag like v1.2.3 on main runs these in release.yml; each also
# runs by hand. <version> is the tag without its v, <build> the commit
# count `release:version` prints.

[tasks."release:version"]
description = "Check a release tag; print its version name and build number"
usage = 'arg "<tag>" help="Like v1.2.3, on main"'
run = 'tool/release/version.sh "{{usage.tag}}"'

[tasks."release:macos"]
description = "Build, sign and notarize the macOS release into dist/"
usage = '''
arg "<version>"
arg "<build>"
'''
run = 'tool/release/macos.sh "{{usage.version}}" "{{usage.build}}" dist'

[tasks."release:ios"]
description = "Build, sign and upload the iOS release to TestFlight"
usage = '''
arg "<version>"
arg "<build>"
'''
run = 'tool/release/ios.sh "{{usage.version}}" "{{usage.build}}"'

[tasks."release:linux"]
description = "Build the AppImage and its feed entry into dist/"
usage = '''
arg "<version>"
arg "<build>"
'''
run = [
  """flutter build linux --release \
    --build-name="{{usage.version}}" --build-number="{{usage.build}}" \
    --dart-define=LOAF_BUILD="{{usage.build}}" \
    --dart-define=LOAF_VERSION="{{usage.version}}\"""",
  'tool/release/appimage.sh "{{usage.version}}" "{{usage.build}}" dist',
  # Tarred: artifacts drop the executable bit, and the Flatpak packs it.
  "tar -cf dist/bundle.tar -C build/linux/x64/release bundle",
]

# Bash, not cmd: windows.sh is a shell script. Run from Git Bash, whose
# bash comes first on the path.
[tasks."release:windows"]
description = "Build the Windows zip, its feed entry and Setup into dist/"
usage = '''
arg "<version>"
arg "<build>"
'''
shell = "bash -c"
run = [
  """flutter build windows --release \
    --build-name="{{usage.version}}" --build-number="{{usage.build}}" \
    --dart-define=LOAF_BUILD="{{usage.build}}\"""",
  'tool/release/windows.sh "{{usage.version}}" "{{usage.build}}" dist',
]

[tasks."release:windows:smoke"]
description = "Install Setup, run the app, swap its files, uninstall (Windows)"
usage = 'arg "<setup>" help="The Setup.exe to try"'
shell = "bash -c"
run = 'tool/release/windows-smoke.sh "{{usage.setup}}"'

[tasks."release:flatpak"]
description = "Commit the Linux bundle to the signed Flatpak repo, as repo.tar"
usage = '''
arg "<version>"
arg "<bundle>" help="bundle.tar from release:linux"
'''
run = [
  'tool/release/flatpak-repo.sh "{{usage.bundle}}" repo',
  'tool/release/flatpak.sh "{{usage.version}}" repo',
  "tar -cf repo.tar repo",
]

[tasks."release:publish"]
description = "Publish the GitHub Release and point get.loaf.moe at it"
usage = '''
arg "<tag>"
arg "<artifacts>" help="One folder per job: macos, linux, windows, flatpak"
'''
run = 'tool/release/publish.sh "{{usage.tag}}" "{{usage.artifacts}}"'

[tasks."release:site"]
description = "Lay out get.loaf.moe's download page, to preview it"
usage = '''
arg "<feed>" help="A latest.json"
arg "<out>"
'''
run = 'tool/release/site.sh "{{usage.feed}}" "{{usage.out}}"'

[tasks."release:keygen"]
description = "Make the three release signing keys, once"
usage = 'arg "<folder>" help="Where the private keys go: outside the repo"'
run = 'tool/release/keygen.sh "{{usage.folder}}"'
