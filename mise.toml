[tools]
rust = { version = "1.100.0", components = "clippy,rustfmt" }

# `mise install` fetches every crate once the toolchain is in, and catches up
# after a pull.
[hooks]
postinstall = { task = "dependencies" }

[tasks.dependencies]
description = "Fetch every crate in the workspace"
run = "cargo fetch --locked"

[tasks.build]
description = "Build every crate"
run = "cargo build --workspace --locked"

[tasks.test]
description = "Run every test"
run = "cargo test --workspace --locked"

[tasks.fmt]
description = "Format the workspace"
run = "cargo fmt --all"

[tasks.lint]
description = "Check formatting and run clippy with warnings as errors"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
]
