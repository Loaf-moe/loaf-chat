[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

# The no-panic policy for loaf-core and loaf-ffi: a panic in the core takes
# down the app, and across UniFFI it would only surface as an opaque error.
# clippy.toml lifts these inside tests.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
