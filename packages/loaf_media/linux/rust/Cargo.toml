[package]
name = "loaf_media_rs"
edition = "2024"
rust-version = "1.92"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
loaf_streams = { path = "../../rust/loaf_streams" }
gst = { package = "gstreamer", version = "0.25" }
gst-base = { package = "gstreamer-base", version = "0.25" }
gst-app = { package = "gstreamer-app", version = "0.25" }
gst-video = { package = "gstreamer-video", version = "0.25" }

[profile.release]
panic = "unwind"   # catch_unwind at the FFI edge needs unwinding
