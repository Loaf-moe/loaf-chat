name: loaf_media
description: "Media files that may still be arriving, and the players that read them."
publish_to: none

environment:
  sdk: ^3.13.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  dbus: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: LoafMediaPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: LoafMediaPlugin
        sharedDarwinSource: true
      linux:
        pluginClass: LoafMediaPlugin
