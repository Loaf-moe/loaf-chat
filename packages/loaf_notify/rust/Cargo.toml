[package]
name = "loaf_notify_win"
edition = "2024"
rust-version = "1.92"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Data_Xml_Dom",
  "Foundation",
  "UI_Notifications",
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_System_WinRT",
] }

[profile.release]
panic = "unwind"   # catch_unwind at the FFI edge needs unwinding
